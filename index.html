<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daraz</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="box1">
      <h3 class="out">Save more on app</h3>
      <h3 class="out">sell on daraz</h3>
      <h3 class="out">Help & support</h3>
      <h3 class="out">login</h3>
      <h3 class="out">sign up</h3>
      <h3 class="out">زبان تبدیل کریں</h3>
    </div>
    <div class="box">
      <img
        src="https://lzd-img-global.slatic.net/us/domino/3b870cb043c7f8a9741cbf66329e294e.png"
        alt="logo"
        class="logo"
      />
      <input type="search" class="inp" placeholder="Search on daraz" />
      <img src="/images/search-outline-svgrepo-com.svg" alt="" class="svge" />
      <svg
        class="svg"
        width="30"
        height="30"
        viewBox="0 0 32 32"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M4.51345 5H1.33325V3H6.15306L7.21972 8.33333H30.5315L27.5012 25H8.51345L4.51345 5ZM7.61972 10.3333L10.1531 23H25.832L28.135 10.3333H7.61972Z"
          fill="white"
        ></path>
        <path
          d="M11.9999 28C11.9999 28.7364 11.403 29.3333 10.6666 29.3333C9.93021 29.3333 9.33325 28.7364 9.33325 28C9.33325 27.2636 9.93021 26.6667 10.6666 26.6667C11.403 26.6667 11.9999 27.2636 11.9999 28Z"
          fill="white"
        ></path>
        <path
          d="M25.3333 29.3333C26.0696 29.3333 26.6666 28.7364 26.6666 28C26.6666 27.2636 26.0696 26.6667 25.3333 26.6667C24.5969 26.6667 23.9999 27.2636 23.9999 28C23.9999 28.7364 24.5969 29.3333 25.3333 29.3333Z"
          fill="white"
        ></path>
      </svg>
    </div>
<!-- bootstrap carousel -->
    <div
      id="carouselExampleAutoplaying"
      class="carousel slide ppc"
      data-bs-autoplay="true"
    >
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img
            src="https://img.lazcdn.com/us/domino/114aae63-df2d-461d-9e16-3e3948f68852_PK-1976-688.jpg_2200x2200q80.jpg_.avif"
            class="d-block w-100 rounded-5"
            alt="..."
          />
        </div>
        <div class="carousel-item">
          <img
            src="https://img.lazcdn.com/us/domino/038afc21-22c8-4275-a88e-bc3629894049_PK-1976-688.jpg_2200x2200q80.jpg_.avif"
            class="d-block w-100 rounded-5"
            alt="..."
          />
        </div>
        <div class="carousel-item">
          <img
            src="https://img.lazcdn.com/us/domino/18097585-4d87-4441-8bc7-4e69b99ae8bd_PK-1976-688.jpg_2200x2200q80.jpg_.avif"
            class="d-block w-100 rounded-5"
            alt="..."
          />
        </div>

        <div class="carousel-item">
          <img
            src="https://img.lazcdn.com/us/domino/6fd6d307-b179-41aa-bec4-9a404bfd32d9_PK-1976-688.jpg_2200x2200q80.jpg_.avif"
            class="d-block w-100 rounded-5"
            alt="..."
          />
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExampleAutoplaying"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleAutoplaying"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleAutoplaying"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
        </div>
        <div>
          <button
            class="btn-icon btn-sm carousel-control-play-pause"
            type="button"
            data-bs-target="#carouselExampleAutoplaying"
            aria-label="Pause"
            data-bs-pause-label="Pause"
            data-bs-play-label="Play"
          >
            <span class="carousel-icon-pause" aria-hidden="true"></span>
            <span class="carousel-icon-play" aria-hidden="true"></span>
          </button>
          <button
            class="btn-icon btn-sm"
            type="button"
            data-bs-target="#carouselExampleAutoplaying"
            data-bs-slide="prev"
          >
            <span class="carousel-icon-prev" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button
            class="btn-icon btn-sm"
            type="button"
            data-bs-target="#carouselExampleAutoplaying"
            data-bs-slide="next"
          >
            <span class="carousel-icon-next" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
